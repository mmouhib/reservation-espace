name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Firestore emulator requires Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Firestore rules tests
        run: npm run test:rules
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-reservation-espace.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-reservation-espace
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-reservation-espace.appspot.com
          NEXT_PUBLIC_USE_EMULATORS: "true"
