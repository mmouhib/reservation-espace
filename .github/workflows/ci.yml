name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test
      # Starts MongoDB with Docker Compose (a one-node replica set, needed for transactions),
      # then the Auth and Functions emulators, seeds the demo data and calls the functions.
      - name: API tests (Cloud Functions on the emulators, MongoDB in Docker)
        run: npm run test:api
        env:
          NEXT_PUBLIC_DEMO_PASSWORD: ci-demo-password
          MONGODB_URI: mongodb://127.0.0.1:27017/reservation?replicaSet=rs0
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-reservation-espace.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-reservation-espace
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-reservation-espace.appspot.com
          NEXT_PUBLIC_USE_EMULATORS: "true"
