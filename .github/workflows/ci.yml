name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Looks for passwords, API keys and tokens in the whole git history, not only in the latest commit:
  # a secret that was committed and removed later is still leaked. Free for repositories owned by a
  # person; a GitHub organization needs a GITLEAKS_LICENSE secret (gitleaks.io).
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test
      # Starts MongoDB with Docker Compose (a one-node replica set, needed for transactions) and the
      # Auth emulator, starts the built server, seeds the demo data and calls the API as real users.
      - name: API tests (server, Auth emulator, MongoDB in Docker)
        run: npm run test:api
        env:
          NEXT_PUBLIC_DEMO_PASSWORD: ci-demo-password
          MONGODB_URI: mongodb://127.0.0.1:27017/reservation?replicaSet=rs0
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-reservation-espace.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-reservation-espace
          NEXT_PUBLIC_USE_EMULATORS: "true"
